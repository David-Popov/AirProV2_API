version: "3.8"
services:
  postgres:
    image: postgres:latest
    container_name: dev_postgres_container
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: AirProV2
    volumes:
      - ./Data/postgres:/var/lib/postgresql
    networks:
      - airpro-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4_container
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: password
    volumes:
      - ./Data/pgadmin:/var/lib/pgadmin
    networks:
      - airpro-network

  minio:
    image: minio/minio:latest
    container_name: minio_container
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./Data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - airpro-network

  backend:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: airpro_backend
    restart: always
    ports:
      - "5209:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=AirProV2;Username=user;Password=12345"
      MinioSettings__Endpoint: "minio:9000"
      MinioSettings__AccessKey: "minioadmin"
      MinioSettings__SecretKey: "minioadmin123"
      MinioSettings__BucketName: "montage-photos"
      MinioSettings__UseSSL: "false"
    depends_on:
      - postgres
      - minio
    networks:
      - airpro-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airpro_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - airpro-network

volumes:
  postgres-data:
  pgadmin-data:
  minio-data:

networks:
  airpro-network:
    driver: bridge
