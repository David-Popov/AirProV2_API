<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{Title}}</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Reset */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
    img { border: 0; -ms-interpolation-mode: bicubic; }
    a { text-decoration: none; }

    /* Base typography */
    body, td, th {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1e293b;
    }

    /* Email wrapper */
    .email-wrapper {
      width: 100%;
      background-color: #f8fafc;
      padding: 32px 16px;
    }

    /* Email card */
    .email-card {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(30, 41, 59, 0.08), 0 1px 4px rgba(30, 41, 59, 0.04);
    }

    /* Header */
    .email-header {
      background: linear-gradient(135deg, #4f8ef5 0%, #2563eb 100%);
      padding: 40px 48px;
      text-align: center;
    }

    .brand-text {
      display: inline-block;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-air { color: #ffffff; }
    .brand-pro { color: #93c5fd; }

    .header-subtitle {
      margin: 8px 0 0 0;
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* Body */
    .email-body {
      padding: 40px 48px;
    }

    /* Footer */
    .email-footer {
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 24px 48px;
      text-align: center;
    }

    .footer-text {
      margin: 0 0 6px 0;
      font-size: 13px;
      color: #64748b;
    }

    .footer-link {
      color: #4f8ef5;
      font-weight: 600;
    }

    .footer-copyright {
      margin: 0;
      font-size: 12px;
      color: #94a3b8;
    }

    /* Headings */
    .email-heading {
      margin: 0 0 12px 0;
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.3px;
    }

    .email-subheading {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }

    /* Body text */
    .email-text {
      margin: 0 0 16px 0;
      font-size: 15px;
      color: #64748b;
      line-height: 1.7;
    }

    /* Divider */
    .email-divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 28px 0;
    }

    /* CTA Button */
    .btn-primary {
      display: inline-block;
      background-color: #4f8ef5;
      color: #ffffff !important;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1px;
    }

    /* Info box */
    .info-box {
      background-color: #eff6ff;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      padding: 16px 20px;
      margin: 20px 0;
    }

    /* Success box */
    .success-box {
      background-color: #d1fae5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 16px 20px;
      margin: 20px 0;
    }

    /* Warning box */
    .warning-box {
      background-color: #fef3c7;
      border: 1px solid #fde68a;
      border-left: 4px solid #f59e0b;
      border-radius: 0 12px 12px 0;
      padding: 16px 20px;
      margin: 20px 0;
    }

    /* Badge */
    .badge {
      display: inline-block;
      background-color: #eff6ff;
      color: #4f8ef5;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #dbeafe;
    }

    /* Responsive */
    @media only screen and (max-width: 640px) {
      .email-body { padding: 28px 24px !important; }
      .email-header { padding: 32px 24px !important; }
      .email-footer { padding: 20px 24px !important; }
      .email-heading { font-size: 20px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f8fafc;">
    <tr>
      <td align="center" style="padding: 32px 16px;">

        <!-- Email Card -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 24px rgba(30, 41, 59, 0.08), 0 1px 4px rgba(30, 41, 59, 0.04);">

          <!-- Header -->
          <tr>
            <td style="background: linear-gradient(135deg, #4f8ef5 0%, #2563eb 100%); padding: 40px 48px; text-align: center;">
              {{LogoHtml}}
              <p style="margin: 8px 0 0 0; color: #bfdbfe; font-size: 13px; font-weight: 500; letter-spacing: 0.02em;">
                Air Conditioning Management Platform
              </p>
            </td>
          </tr>

          <!-- Body Content -->
          <tr>
            <td style="padding: 40px 48px; background-color: #ffffff;">
              {{Content}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #f8fafc; border-top: 1px solid #e2e8f0; padding: 24px 48px; text-align: center;">
              <p style="margin: 0 0 6px 0; font-size: 13px; color: #64748b; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
                Questions? Contact us at
                <a href="mailto:{{SupportEmail}}" style="color: #4f8ef5; font-weight: 600; text-decoration: none;">{{SupportEmail}}</a>
              </p>
              <p style="margin: 0; font-size: 12px; color: #94a3b8; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
                &copy; {{Year}} {{SenderName}}. All rights reserved.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Email Card -->

      </td>
    </tr>
  </table>

</body>
</html>
