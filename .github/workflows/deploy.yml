name: CD – Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ~/AirProV2_API

            echo "Pulling latest code..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Backing up database..."
            mkdir -p ~/backups
            BACKUP_FILE=~/backups/airpro_$(date +%Y%m%d_%H%M%S).sql
            docker exec prod_postgres pg_dump -U airpro_prod_user AirProV2 > "$BACKUP_FILE"
            echo "Backup saved to $BACKUP_FILE"

            echo "Pruning backups older than 7 days..."
            find ~/backups -name "airpro_*.sql" -mtime +7 -delete

            echo "Building new images..."
            docker compose -p airpro-prod -f docker-compose.prod.yml build

            echo "Removing legacy gateway / staging containers (prod frontend now binds :80 directly)..."
            docker rm -f airpro_gateway 2>/dev/null || true
            docker rm -f staging_frontend staging_backend staging_postgres staging_minio staging_pgadmin 2>/dev/null || true

            echo "Restarting containers (migrations run on backend startup)..."
            docker compose -p airpro-prod -f docker-compose.prod.yml up -d

            echo "Cleaning up unused images..."
            docker image prune -f

            echo "Deploy complete."
