server {
    listen 80;
    server_name staging.airprobg.com;

    root /usr/share/nginx/html;
    index index.html;

    # PWA: Service Worker must never be HTTP-cached
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Service-Worker-Allowed "/";
        expires off;
    }

    # PWA: Web App Manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        default_type application/manifest+json;
    }

    # Static assets: immutable cache (Vite fingerprints filenames)
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — no-cache on index.html so SW update checks trigger
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
