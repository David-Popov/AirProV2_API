<h1 style="margin: 0 0 12px 0; font-size: 22px; font-weight: 700; color: #1e293b; letter-spacing: -0.3px; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
  Confirm Your Email Address
</h1>

<p style="margin: 0 0 8px 0; font-size: 15px; color: #64748b; line-height: 1.7; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
  Hi <strong style="color: #1e293b;">{{UserName}}</strong>,
</p>

<p style="margin: 0 0 28px 0; font-size: 15px; color: #64748b; line-height: 1.7; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
  Thank you for registering with AirPro. Please confirm your email address by clicking the button below to activate your account.
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td align="center">
      <a href="{{ConfirmLink}}"
         style="display: inline-block; background-color: #4f8ef5; color: #ffffff; text-decoration: none; padding: 14px 36px; border-radius: 10px; font-size: 15px; font-weight: 600; letter-spacing: 0.1px; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
        Confirm Email Address
      </a>
    </td>
  </tr>
</table>

<hr style="border: none; border-top: 1px solid #e2e8f0; margin: 28px 0;">

<p style="margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.6; text-align: center; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
  If you did not create an AirPro account, you can safely ignore this email.
</p>
