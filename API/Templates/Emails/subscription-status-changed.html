<h1 style="margin: 0 0 12px 0; font-size: 22px; font-weight: 700; color: #1e293b; letter-spacing: -0.3px; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
  Subscription Status Update
</h1>

<p style="margin: 0 0 20px 0; font-size: 15px; color: #64748b; line-height: 1.7; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
  Dear <strong style="color: #1e293b;">{{CompanyName}}</strong>,
</p>

<p style="margin: 0 0 20px 0; font-size: 15px; color: #64748b; line-height: 1.7; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
  {{StatusMessage}}
</p>

<!-- Status change table -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 20px; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td style="padding: 4px 0; font-size: 14px; color: #64748b; width: 140px;">Previous Status</td>
          <td style="padding: 4px 0; font-size: 14px; font-weight: 600; color: #1e293b;">{{PreviousStatus}}</td>
        </tr>
        <tr>
          <td style="padding: 4px 0; font-size: 14px; color: #64748b; width: 140px;">New Status</td>
          <td style="padding: 4px 0; font-size: 14px; font-weight: 600; color: #4f8ef5;">{{NewStatus}}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>

{{AdditionalInfo}}

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-top: 32px;">
  <tr>
    <td align="center">
      <a href="{{ViewUrl}}"
         style="display: inline-block; background-color: #4f8ef5; color: #ffffff; text-decoration: none; padding: 14px 36px; border-radius: 10px; font-size: 15px; font-weight: 600; letter-spacing: 0.1px; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">
        View Subscription
      </a>
    </td>
  </tr>
</table>
